<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>DRIXIO STUDIO</title>
    <!-- Native Textarea for SQL Console -->
  </head>

  <body>
    <div id="sidebar-container"></div>
    <main>
      <div id="header-container"></div>
      <div id="tab-container"></div>
      <div id="main-content"></div>
    </main>

    <div id="modal-editor-overlay" class="hidden">
      <div class="modal-editor-container">
        <div class="modal-header">
          <span class="material-symbols-outlined">edit_document</span>
          <h3 id="modal-title">Edit Cell</h3>
        </div>
        <textarea id="modal-textarea" placeholder="Enter value..."></textarea>
        <div class="modal-footer">
          <button type="button" id="modal-cancel-btn">Cancel</button>
          <button type="button" id="modal-save-btn" class="primary">
            Save
          </button>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
